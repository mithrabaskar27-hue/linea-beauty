<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LINÉA Beauty</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Georgia, serif;
            background: #fff0f3;
            color: #38232b;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            background: white;
            border-radius: 22px;
            border: 1px solid #f1d5dc;
            box-shadow: 0 15px 45px #8b29421a;
            text-align: center;
        }

        .logo {
            color: #8b2942;
            font-size: 30px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .tagline {
            color: #97727d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #806b72;
            margin-bottom: 25px;
        }

        .field {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e3c4ce;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #bd7188;
            border-color: transparent;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 22px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember input {
            width: auto;
        }

        a {
            color: #8b2942;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #8b2942;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #bd5872;
        }

        .signup {
            margin-top: 24px;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">LINÉA BEAUTY</div>
        <p class="tagline">A little elegance in every line.</p>

        <h2>Welcome Back</h2>
        <p class="subtitle">Your beauty journey starts here.</p>

        <form id="loginForm">
            <div class="field">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="showPassword">
                    Show password
                </label>

                <a href="#" id="forgotLink">Forgot password?</a>
            </div>

            <button class="login-button" type="submit">
                Sign In
            </button>
        </form>

        <p class="signup">
            New to LINÉA?
            <a href="signup.html">Create an account</a>
        </p>

        <a class="back" href="index.html">← Back to Home</a>
        <p id="message" role="status"></p>
    </main>

    <script>
        const password = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        showPassword.addEventListener("change", function () {
            if (showPassword.checked) {
                password.type = "text";
            } else {
                password.type = "password";
            }
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();
            message.textContent =
                "Login design works! Account authentication is not connected yet.";
        });

        document.getElementById("forgotLink").addEventListener("click", function (event) {
            event.preventDefault();
            message.textContent =
                "Password recovery will be available after backend setup.";
        });

        document.getElementById("signupLink").addEventListener("click", function (event) {
            event.preventDefault();
            message.textContent =
                "We'll create your sign-up page next!";
        });
    </script>
</body>
</html>
