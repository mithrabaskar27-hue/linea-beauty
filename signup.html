<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LINÉA Beauty</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #fff0f3;
            font-family: Georgia, serif;
            color: #38232b;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border: 1px solid #f1d5dc;
            border-radius: 22px;
            box-shadow: 0 15px 45px #8b29421a;
        }

        h1 {
            text-align: center;
            color: #8b2942;
            letter-spacing: 3px;
            font-size: 27px;
        }

        h2 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #806b72;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e3c4ce;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 25px;
            background: #8b2942;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #bd5872;
        }

        p {
            text-align: center;
        }

        a {
            color: #8b2942;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>LINÉA BEAUTY</h1>
        <h2>Create Your Account</h2>
        <p class="subtitle">Your beauty journey begins here.</p>

        <form id="signupForm">
            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="password">Create Password</label>
            <input type="password" id="password"
                   minlength="8" placeholder="At least 8 characters"
                   required>

            <button type="submit">Create Account</button>
        </form>

        <p id="message" role="status"></p>
        <p>Already a member? <a href="login.html">Sign In</a></p>
        <p><a href="index.html">← Back to Home</a></p>
    </main>
<script>
const form = document.getElementById("signupForm");
const message = document.getElementById("message");

console.log("LINÉA signup script loaded");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    console.log("Signup button clicked");

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Creating your account...";

    try {
        const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, email, password })
        });

        const result = await response.json();

        message.textContent = result.message;

        console.log("Signup response:", response.status, result);

    } catch (error) {
        console.error("Signup error:", error);
        message.textContent =
            "Could not connect. Check that the server is running.";
    }
});
</script>
</body>
</html>
